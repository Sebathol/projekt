<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Generator - Von der Idee zum Prototyp</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        h1 {
            text-align: center;
            color: #f59e0b;
            margin-bottom: 30px;
        }
        .preview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .icon-preview {
            text-align: center;
        }
        .icon-preview canvas {
            border: 2px solid #f59e0b;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .icon-preview p {
            font-size: 12px;
            color: #666;
        }
        button {
            background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
        button:hover {
            opacity: 0.9;
        }
        .info {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💡 Icon Generator</h1>

        <div class="info">
            <strong>Anleitung:</strong><br>
            1. Klicke auf "Icons Generieren"<br>
            2. Rechtsklick auf jedes Icon → "Bild speichern unter"<br>
            3. Speichere im <code>icons/</code> Ordner mit dem angezeigten Namen
        </div>

        <button onclick="generateAllIcons()">Icons Generieren</button>

        <div class="preview" id="preview"></div>
    </div>

    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];

        function drawIcon(canvas, size) {
            const ctx = canvas.getContext('2d');
            canvas.width = size;
            canvas.height = size;

            // Background gradient (orange)
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#f59e0b');
            gradient.addColorStop(1, '#ea580c');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);

            // Draw lightbulb icon
            ctx.fillStyle = 'white';
            ctx.strokeStyle = 'white';
            ctx.lineWidth = size * 0.05;

            // Bulb
            const centerX = size / 2;
            const centerY = size * 0.4;
            const radius = size * 0.2;

            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fill();

            // Light rays
            const rayLength = size * 0.1;
            const rayCount = 8;
            for (let i = 0; i < rayCount; i++) {
                const angle = (Math.PI * 2 / rayCount) * i;
                const startX = centerX + Math.cos(angle) * (radius + size * 0.05);
                const startY = centerY + Math.sin(angle) * (radius + size * 0.05);
                const endX = centerX + Math.cos(angle) * (radius + size * 0.05 + rayLength);
                const endY = centerY + Math.sin(angle) * (radius + size * 0.05 + rayLength);

                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(endX, endY);
                ctx.stroke();
            }

            // Base
            const baseWidth = size * 0.15;
            const baseHeight = size * 0.15;
            const baseY = centerY + radius;

            ctx.fillRect(
                centerX - baseWidth / 2,
                baseY,
                baseWidth,
                baseHeight
            );

            // Thread lines
            const threadCount = 3;
            const threadSpacing = baseHeight / (threadCount + 1);
            ctx.lineWidth = size * 0.02;
            for (let i = 1; i <= threadCount; i++) {
                const y = baseY + threadSpacing * i;
                ctx.beginPath();
                ctx.moveTo(centerX - baseWidth / 2, y);
                ctx.lineTo(centerX + baseWidth / 2, y);
                ctx.stroke();
            }
        }

        function generateAllIcons() {
            const preview = document.getElementById('preview');
            preview.innerHTML = '';

            sizes.forEach(size => {
                const container = document.createElement('div');
                container.className = 'icon-preview';

                const canvas = document.createElement('canvas');
                drawIcon(canvas, size);

                const label = document.createElement('p');
                label.textContent = `icon-${size}x${size}.png`;

                const downloadBtn = document.createElement('button');
                downloadBtn.textContent = 'Download';
                downloadBtn.style.padding = '5px 10px';
                downloadBtn.style.fontSize = '12px';
                downloadBtn.style.marginTop = '5px';
                downloadBtn.onclick = () => {
                    const link = document.createElement('a');
                    link.download = `icon-${size}x${size}.png`;
                    link.href = canvas.toDataURL();
                    link.click();
                };

                container.appendChild(canvas);
                container.appendChild(label);
                container.appendChild(downloadBtn);
                preview.appendChild(container);
            });
        }

        // Generate on load
        window.onload = generateAllIcons;
    </script>
</body>
</html>
