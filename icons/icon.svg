<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGradient)" rx="80"/>

  <!-- Lightbulb -->
  <g transform="translate(256, 180)">
    <!-- Bulb -->
    <circle cx="0" cy="0" r="80" fill="white"/>

    <!-- Light Rays -->
    <g stroke="white" stroke-width="12" stroke-linecap="round">
      <line x1="0" y1="-110" x2="0" y2="-140"/>
      <line x1="78" y1="-78" x2="100" y2="-100"/>
      <line x1="110" y1="0" x2="140" y2="0"/>
      <line x1="78" y1="78" x2="100" y2="100"/>
      <line x1="0" y1="110" x2="0" y2="140"/>
      <line x1="-78" y1="78" x2="-100" y2="100"/>
      <line x1="-110" y1="0" x2="-140" y2="0"/>
      <line x1="-78" y1="-78" x2="-100" y2="-100"/>
    </g>

    <!-- Base -->
    <rect x="-35" y="80" width="70" height="80" fill="white" rx="5"/>

    <!-- Thread Lines -->
    <g stroke="#f59e0b" stroke-width="8">
      <line x1="-35" y1="100" x2="35" y2="100"/>
      <line x1="-35" y1="120" x2="35" y2="120"/>
      <line x1="-35" y1="140" x2="35" y2="140"/>
    </g>
  </g>

  <!-- Text (optional) -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="white" text-anchor="middle">I→P</text>
</svg>
