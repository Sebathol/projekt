  <ellipse cx="250" cy="280" rx="80" ry="60" fill="white" opacity="0.95"/>
  <ellipse cx="300" cy="300" rx="70" ry="50" fill="white" opacity="0.95"/>

  <!-- Temperatur Symbol -->
