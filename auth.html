<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Registrierung - Von der Idee zum Prototyp</title>
    <meta name="theme-color" content="#f59e0b">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/js/auth.js"></script>
</head>
<body class="bg-gradient-to-br from-stone-50 to-amber-50 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-md mx-auto">
            <!-- Header -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-br from-amber-500 to-orange-600 rounded-full mb-4">
                    <lucide-icon icon-name="lightbulb" class="w-10 h-10 text-white"></lucide-icon>
                </div>
                <h1 class="text-3xl font-bold text-stone-800 mb-2">
                    Von der Idee zum Prototyp
                </h1>
                <p class="text-stone-600">KI-gestützte Prototyp-Entwicklung</p>
            </div>

            <!-- Tab Selection -->
            <div class="bg-white rounded-xl shadow-lg overflow-hidden">
                <div class="flex border-b border-stone-200">
                    <button
                        id="tab-login"
                        class="flex-1 py-4 text-center font-semibold transition active-tab"
                        onclick="switchTab('login')"
                    >
                        Anmelden
                    </button>
                    <button
                        id="tab-register"
                        class="flex-1 py-4 text-center font-semibold transition"
                        onclick="switchTab('register')"
                    >
                        Registrieren
                    </button>
                </div>

                <!-- Login Form -->
                <div id="form-login" class="p-6">
                    <form onsubmit="handleLogin(event)">
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-stone-700 mb-2">
                                    E-Mail
                                </label>
                                <input
                                    type="email"
                                    id="login-email"
                                    required
                                    class="w-full px-4 py-3 border-2 border-stone-200 rounded-lg focus:border-amber-500 focus:outline-none"
                                    placeholder="ihre@email.de"
                                />
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-stone-700 mb-2">
                                    Passwort
                                </label>
                                <input
                                    type="password"
                                    id="login-password"
                                    required
                                    minlength="6"
                                    class="w-full px-4 py-3 border-2 border-stone-200 rounded-lg focus:border-amber-500 focus:outline-none"
                                    placeholder="••••••"
                                />
                            </div>

                            <div id="login-error" class="hidden bg-red-50 border-l-4 border-red-500 p-4 rounded text-red-700 text-sm"></div>

                            <button
                                type="submit"
                                id="login-btn"
                                class="w-full bg-gradient-to-r from-amber-600 to-orange-600 text-white py-3 rounded-lg font-semibold hover:from-amber-700 hover:to-orange-700 transition flex items-center justify-center gap-2"
                            >
                                <lucide-icon icon-name="log-in" class="w-5 h-5"></lucide-icon>
                                Anmelden
                            </button>
                        </div>
                    </form>

                    <div class="mt-6 text-center">
                        <a href="#" class="text-sm text-amber-600 hover:text-amber-700">
                            Passwort vergessen?
                        </a>
                    </div>
                </div>

                <!-- Register Form -->
                <div id="form-register" class="p-6 hidden">
                    <form onsubmit="handleRegister(event)">
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-stone-700 mb-2">
                                    E-Mail
                                </label>
                                <input
                                    type="email"
                                    id="register-email"
                                    required
                                    class="w-full px-4 py-3 border-2 border-stone-200 rounded-lg focus:border-amber-500 focus:outline-none"
                                    placeholder="ihre@email.de"
                                />
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-stone-700 mb-2">
                                    Passwort
                                </label>
                                <input
                                    type="password"
                                    id="register-password"
                                    required
                                    minlength="6"
                                    class="w-full px-4 py-3 border-2 border-stone-200 rounded-lg focus:border-amber-500 focus:outline-none"
                                    placeholder="Mindestens 6 Zeichen"
                                />
                                <p class="text-xs text-stone-500 mt-1">Mindestens 6 Zeichen</p>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-stone-700 mb-2">
                                    Passwort bestätigen
                                </label>
                                <input
                                    type="password"
                                    id="register-password-confirm"
                                    required
                                    minlength="6"
                                    class="w-full px-4 py-3 border-2 border-stone-200 rounded-lg focus:border-amber-500 focus:outline-none"
                                    placeholder="••••••"
                                />
                            </div>

                            <div id="register-error" class="hidden bg-red-50 border-l-4 border-red-500 p-4 rounded text-red-700 text-sm"></div>

                            <div class="bg-amber-50 border border-amber-200 rounded-lg p-4">
                                <p class="text-sm text-stone-700">
                                    <strong>Free Plan inklusive:</strong><br>
                                    3 kostenlose Workflows zum Testen!
                                </p>
                            </div>

                            <button
                                type="submit"
                                id="register-btn"
                                class="w-full bg-gradient-to-r from-amber-600 to-orange-600 text-white py-3 rounded-lg font-semibold hover:from-amber-700 hover:to-orange-700 transition flex items-center justify-center gap-2"
                            >
                                <lucide-icon icon-name="user-plus" class="w-5 h-5"></lucide-icon>
                                Kostenlos registrieren
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Footer -->
            <div class="mt-6 text-center text-sm text-stone-600">
                <p>
                    Mit der Anmeldung akzeptieren Sie unsere
                    <a href="#" class="text-amber-600 hover:text-amber-700">AGB</a> und
                    <a href="#" class="text-amber-600 hover:text-amber-700">Datenschutz</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Check if already logged in
        if (Auth.isLoggedIn()) {
            window.location.href = '/index.html';
        }

        // Switch between login and register tabs
        function switchTab(tab) {
            const loginTab = document.getElementById('tab-login');
            const registerTab = document.getElementById('tab-register');
            const loginForm = document.getElementById('form-login');
            const registerForm = document.getElementById('form-register');

            if (tab === 'login') {
                loginTab.classList.add('active-tab');
                registerTab.classList.remove('active-tab');
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
            } else {
                registerTab.classList.add('active-tab');
                loginTab.classList.remove('active-tab');
                registerForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
            }
        }

        // Handle login
        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');

            try {
                btn.disabled = true;
                btn.innerHTML = '<lucide-icon icon-name="loader" class="w-5 h-5 animate-spin"></lucide-icon> Anmelden...';
                errorEl.classList.add('hidden');

                await Auth.login(email, password);

                // Redirect to main page
                window.location.href = '/index.html';

            } catch (error) {
                errorEl.textContent = error.message;
                errorEl.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = '<lucide-icon icon-name="log-in" class="w-5 h-5"></lucide-icon> Anmelden';
                lucide.createIcons();
            }
        }

        // Handle register
        async function handleRegister(event) {
            event.preventDefault();

            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const passwordConfirm = document.getElementById('register-password-confirm').value;
            const errorEl = document.getElementById('register-error');
            const btn = document.getElementById('register-btn');

            try {
                // Check if passwords match
                if (password !== passwordConfirm) {
                    throw new Error('Passwörter stimmen nicht überein');
                }

                btn.disabled = true;
                btn.innerHTML = '<lucide-icon icon-name="loader" class="w-5 h-5 animate-spin"></lucide-icon> Registrieren...';
                errorEl.classList.add('hidden');

                await Auth.register(email, password);

                // Redirect to main page
                window.location.href = '/index.html';

            } catch (error) {
                errorEl.textContent = error.message;
                errorEl.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = '<lucide-icon icon-name="user-plus" class="w-5 h-5"></lucide-icon> Kostenlos registrieren';
                lucide.createIcons();
            }
        }
    </script>

    <style>
        .active-tab {
            background: linear-gradient(to bottom, #ffffff, #fef3c7);
            color: #f59e0b;
            border-bottom: 3px solid #f59e0b;
        }
    </style>
</body>
</html>
