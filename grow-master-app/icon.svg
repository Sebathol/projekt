<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#388E3C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#81C784;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#66BB6A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGradient)"/>

  <!-- Plant Stem -->
  <path d="M 50 70 Q 48 55, 50 40" stroke="#2E7D32" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Left Leaf -->
  <path d="M 50 50 Q 35 45, 30 42 Q 35 50, 50 52 Z" fill="url(#leafGradient)" stroke="#2E7D32" stroke-width="1.5"/>

  <!-- Right Leaf -->
  <path d="M 50 45 Q 65 40, 70 37 Q 65 45, 50 47 Z" fill="url(#leafGradient)" stroke="#2E7D32" stroke-width="1.5"/>

  <!-- Top Leaf -->
  <path d="M 50 40 Q 48 30, 50 25 Q 52 30, 50 40 Z" fill="url(#leafGradient)" stroke="#2E7D32" stroke-width="1.5"/>

  <!-- Pot -->
  <path d="M 35 70 L 38 82 L 62 82 L 65 70 Z" fill="#8D6E63" stroke="#5D4037" stroke-width="2"/>
  <ellipse cx="50" cy="70" rx="15" ry="4" fill="#6D4C41"/>

  <!-- AI Sparkle -->
  <circle cx="70" cy="25" r="3" fill="#FFD700" opacity="0.9">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <path d="M 70 20 L 70 30 M 65 25 L 75 25" stroke="#FFD700" stroke-width="1.5" opacity="0.9">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
  </path>
</svg>
