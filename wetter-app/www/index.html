<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wetter App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="weather-app">
            <h1>Wetter App</h1>

            <div class="search-box">
                <input type="text" id="city-input" placeholder="Stadt eingeben..." value="Berlin">
                <button id="search-btn">Suchen</button>
            </div>

            <div id="loading" class="loading hidden">Lädt...</div>
            <div id="error" class="error hidden"></div>

            <div id="weather-info" class="weather-info hidden">
                <h2 id="city-name"></h2>
                <div class="temperature">
                    <span id="temp" class="temp"></span>
                </div>
                <div id="description" class="description"></div>

                <div class="details">
                    <div class="detail-item">
                        <span class="label">Gefühlt:</span>
                        <span id="feels-like"></span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Luftfeuchtigkeit:</span>
                        <span id="humidity"></span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Wind:</span>
                        <span id="wind"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
